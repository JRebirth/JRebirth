name: Snapshot to GitHub Packages

on:
  push:
    branches: [12.x-dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  snapshot:
    uses: JRebirth/JRebirth-Organization-POM/.github/workflows/reusable-maven-snapshot.yml@master
    with:
      java-version: "25"
      pom-path: org.jrebirth.af/pom.xml
      # Libraries only (no showcase/sample/distribution — jlink demos break Temurin CI).
      # reusable workflow runs `set +H` so '!' exclusions are safe.
      maven-args: "-B -Pgithub-packages deploy -Dmaven.test.skip=true -pl !showcase,!sample,!distribution"
    secrets: inherit
