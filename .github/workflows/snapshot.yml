name: Snapshot to GitHub Packages

on:
  push:
    branches: [12.x-dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Maven settings (GitHub Packages)
        run: |
          mkdir -p "$HOME/.m2"
          curl -fsSL https://raw.githubusercontent.com/JRebirth/JRebirth-Organization-POM/master/.github/maven-settings.xml \
            -o "$HOME/.m2/settings.xml"

      - name: Deploy library SNAPSHOTs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Excluding aggregator 'showcase' alone does NOT drop its children — list every path.
        # Quote -pl so bash never expands '!'.
        run: |
          set +H
          mvn -B -f org.jrebirth.af/pom.xml -Pgithub-packages deploy \
            -Dmaven.test.skip=true \
            -pl '!sample,!distribution,!showcase,!showcase/demo,!showcase/analyzer,!showcase/undoredo,!showcase/fxml,!showcase/wave,!showcase/todos,!showcase/workbench,!showcase/fonticon'
