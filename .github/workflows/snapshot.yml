name: Snapshot to GitHub Packages

on:
  push:
    branches: [12.x-dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  snapshot:
    uses: JRebirth/JRebirth-Organization-POM/.github/workflows/reusable-maven-snapshot.yml@master
    with:
      java-version: "25"
      pom-path: org.jrebirth.af/pom.xml
      # Libraries only: skip showcase (jlink/demo apps) and tests; still publish iconfont-bridge etc.
      maven-args: "-B -Pgithub-packages deploy -Dmaven.test.skip=true -pl !showcase"
    secrets: inherit
