name: Snapshot to GitHub Packages

on:
  push:
    branches: [12.x-dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  snapshot:
    uses: JRebirth/JRebirth-Organization-POM/.github/workflows/reusable-maven-snapshot.yml@master
    with:
      java-version: "25"
      pom-path: org.jrebirth.af/pom.xml
      # Libraries only (no showcase/sample/distribution — jlink demos break Temurin CI images).
      # Explicit -pl avoids bash '!' history expansion eating exclusions.
      maven-args: >-
        -B -Pgithub-packages deploy -Dmaven.test.skip=true
        -pl api,preloader,resources,core,tooling,codegen,ecore2fx,text2fx,jrebirth-maven-plugin,processor,component,presentation,transition,dialog,fxform,undoredo,security,rest,archetype,iconfont-bridge,fontawesome,materialdesignicons,weathericons,525icons,emojione,typicons
    secrets: inherit
