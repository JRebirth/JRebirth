name: Snapshot to GitHub Packages

on:
  push:
    branches: [12.x-dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  snapshot:
    uses: JRebirth/JRebirth-Organization-POM/.github/workflows/reusable-maven-snapshot.yml@master
    with:
      java-version: "25"
      pom-path: org.jrebirth.af/pom.xml
      # Skip test compile+run (showcase fxml tests break snapshot publish; jars still build)
      maven-args: "-B -Pgithub-packages deploy -Dmaven.test.skip=true"
    secrets: inherit
