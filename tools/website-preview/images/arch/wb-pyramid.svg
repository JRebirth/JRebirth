<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" fill="none">
  <defs>
    <linearGradient id="faceL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6e20" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#ff6e20" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="faceR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#31baff" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#31baff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="faceF" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffb447" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffb447" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6e20"/>
      <stop offset="50%" stop-color="#31baff"/>
      <stop offset="100%" stop-color="#c9a6ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Wave paths: sender facade → Notifier (GF core) → target facade -->
    <path id="w1" d="M250 430 C 310 390, 390 340, 480 320 C 570 300, 650 360, 710 430"/>
    <path id="w2" d="M710 430 C 650 380, 560 330, 480 320 C 420 340, 450 430, 480 500"/>
    <path id="w3" d="M480 500 C 420 450, 380 360, 480 320 C 560 300, 520 230, 480 160"/>
  </defs>

  <!-- vertices: BF(480,160) CF(250,430) SF(710,430) UF(480,500) core GF(480,320) -->
  <polygon points="480,160 250,430 480,320" fill="url(#faceL)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="480,160 710,430 480,320" fill="url(#faceR)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" begin="2s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="250,430 710,430 480,500 480,320" fill="url(#faceF)" opacity="0.55"/>
  <polygon points="250,430 710,430 480,500" fill="rgba(7,15,28,0.45)" stroke="rgba(255,180,71,0.3)" stroke-width="1.5"/>

  <g stroke="url(#edge)" stroke-width="2.8" filter="url(#glow)">
    <line x1="480" y1="160" x2="250" y2="430"/>
    <line x1="480" y1="160" x2="710" y2="430"/>
    <line x1="480" y1="160" x2="480" y2="500"/>
    <line x1="250" y1="430" x2="710" y2="430"/>
    <line x1="250" y1="430" x2="480" y2="500"/>
    <line x1="710" y1="430" x2="480" y2="500"/>
  </g>

  <g stroke="rgba(255,180,71,0.4)" stroke-width="1.4" stroke-dasharray="4 4">
    <line x1="480" y1="160" x2="480" y2="320"/>
    <line x1="250" y1="430" x2="480" y2="320"/>
    <line x1="710" y1="430" x2="480" y2="320"/>
    <line x1="480" y1="500" x2="480" y2="320"/>
  </g>

  <!-- vertex anchors -->
  <circle cx="480" cy="160" r="5" fill="#c9a6ff" filter="url(#glow)"/>
  <circle cx="250" cy="430" r="5" fill="#ff6e20" filter="url(#glow)"/>
  <circle cx="710" cy="430" r="5" fill="#31baff" filter="url(#glow)"/>
  <circle cx="480" cy="500" r="5" fill="#ffb447" filter="url(#glow)"/>

  <!-- waves: hidden until JS marks the tree complete (id=jr-waves) -->
  <g id="jr-waves" opacity="0">
    <circle r="4.5" fill="#ff6e20" filter="url(#glow)">
      <animateMotion dur="4.2s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion>
    </circle>
    <circle r="4.5" fill="#31baff" filter="url(#glow)">
      <animateMotion dur="5s" repeatCount="indefinite" begin="1.2s"><mpath href="#w2"/></animateMotion>
    </circle>
    <circle r="4" fill="#ffb447" filter="url(#glow)">
      <animateMotion dur="3.8s" repeatCount="indefinite" begin="0.6s"><mpath href="#w3"/></animateMotion>
    </circle>
  </g>
</svg>
